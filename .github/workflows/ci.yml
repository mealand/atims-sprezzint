name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Shared canonical & hash tests
        run: npm run test -w @atims/shared
      - name: Unit tests (chain, gates)
        run: npm run test -w @atims/api --if-present
      - name: Typecheck everything
        run: npm run build
