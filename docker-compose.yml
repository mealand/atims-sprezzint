# ATiMs local stack: Postgres (ledger) + MinIO (evidence object storage).
# docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: atims-postgres
    ports: ["5433:5432"]
    environment:
      POSTGRES_USER: atims
      POSTGRES_PASSWORD: atims
      POSTGRES_DB: atims
    volumes:
      - atims_pgdata:/var/lib/postgresql/data
  minio:
    # Official minio/minio was removed from Docker Hub; this is the community rebuild
    # of the last CVE-fixed release (see minio/minio#21647).
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: atims-minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    environment:
      MINIO_ROOT_USER: atims-minio
      MINIO_ROOT_PASSWORD: atims-minio-secret
    volumes:
      - atims_minio:/data
volumes:
  atims_pgdata: {}
  atims_minio: {}
